name: Build LazyAria

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build release APK'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "26.1.10909125"
  GRADLE_VERSION: "8.6"

jobs:
  # ── Rust cross-compile ──────────────────────────────────────────────────────
  rust-build:
    name: Rust (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: rust-${{ matrix.target }}-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: rust-${{ matrix.target }}-

      # ubuntu-latest already has Android SDK at $ANDROID_SDK_ROOT
      # Just install NDK via sdkmanager — no third-party action needed
      - name: Install NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;$NDK_VERSION"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build .so
        working-directory: rust-core
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION
          cargo ndk -t ${{ matrix.target }} -o ../app/src/main/jniLibs build --release

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: so-${{ matrix.target }}
          path: app/src/main/jniLibs/

  # ── Android APK ─────────────────────────────────────────────────────────────
  android-build:
    name: Android APK
    runs-on: ubuntu-latest
    needs: rust-build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Bootstrap Gradle wrapper — no jar in repo
      - name: Bootstrap Gradle wrapper
        run: |
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
            --gradle-version ${GRADLE_VERSION} \
            --distribution-type bin
          chmod +x gradlew

      - name: Download all .so artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: so-*
          path: app/src/main/jniLibs/
          merge-multiple: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        if: ${{ !inputs.build_release }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: ${{ inputs.build_release }}
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "$KEYSTORE_FILE" | base64 -d > keystore.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew assembleRelease
          fi

      - name: Upload debug APK
        if: ${{ !inputs.build_release }}
        uses: actions/upload-artifact@v4
        with:
          name: LazyAria-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APK
        if: ${{ inputs.build_release }}
        uses: actions/upload-artifact@v4
        with:
          name: LazyAria-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: ${{ inputs.build_release && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
