[package]
name = "lazyaria-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "lazyaria_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
url = "2.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
regex = "1"
# Bloom filter — O(1) host lookup, ~1MB for 100k rules at 1% FPR
bloomfilter = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
